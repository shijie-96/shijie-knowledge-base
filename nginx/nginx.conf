# =========================================================
# 认知闭环系统 · Nginx 反向代理 / 静态托管 / TLS 终结
# 挂载路径：/etc/nginx/nginx.conf
# SSL 证书：./nginx/ssl/fullchain.pem + privkey.pem（Let's Encrypt / 其他 CA）
# =========================================================

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ---- JSON 访问日志（便于 filebeat/logstash 采集） ----
  log_format main_json escape=json
    '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"duration":$request_time,'
    '"bytes":$body_bytes_sent,"ua":"$http_user_agent","referer":"$http_referer"}';
  access_log /var/log/nginx/access.log main_json;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  # ---- 压缩 ----
  gzip on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript
             application/xml image/svg+xml font/woff2;

  # ---- 基础安全头（应用侧已启用 helmet，这里做网络层兜底） ----
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # ---- HTTP：自动跳转 HTTPS（生产启用 SSL 后打开下面的 return） ----
  server {
    listen 80;
    server_name _;

    # 生产启用 HTTPS 后取消注释：
    # return 301 https://$host$request_uri;

    # 反代后端 API：/api/xxx → backend:3001/xxx
    location /api/ {
      # 允许大请求体：后端已放宽到 20mb。这里与后端保持一致，
      # 否则 Nginx 默认 1MB 仍会先于后端返回 413。
      client_max_body_size 20m;
      proxy_pass http://backend:3001/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 10s;
      proxy_read_timeout 120s;

      # SSE 流式关键配置：关闭缓冲，否则不会逐字输出（打字机效果失效）
      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Connection "";
    }

    # 用户上传文件（头像/自定义背景等）：Nginx 直读共享卷，绕开 Node/Next
    location /uploads/ {
      alias /srv/uploads/;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    # 前端（Next.js standalone）
    location / {
      client_max_body_size 20m;
      proxy_pass http://frontend:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }

  # ---- HTTPS（生产：放置证书后启用） ----
  # server {
  #   listen 443 ssl http2;
  #   server_name your-domain.com;
  #
  #   ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   ssl_ciphers         HIGH:!aNULL:!MD5;
  #   ssl_prefer_server_ciphers on;
  #   ssl_session_cache   shared:SSL:10m;
  #   ssl_session_timeout 10m;
  #
  #   # 相同的 location 配置（复制自 HTTP server 块）
  #   location /uploads/ {
  #     alias /srv/uploads/;
  #     expires 30d;
  #     add_header Cache-Control "public, max-age=2592000, immutable";
  #     try_files $uri =404;
  #   }
  #   location /api/ {
  #     proxy_pass http://backend:3001/;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto https;
  #     proxy_read_timeout 120s;
  #     proxy_buffering off;   # SSE：关闭缓冲实现打字机
  #     proxy_cache off;
  #     proxy_set_header Connection "";
  #   }
  #   location / {
  #     proxy_pass http://frontend:3000;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
