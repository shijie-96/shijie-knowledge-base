    <style id="theme-vars">
/* CogniCard Design Tokens — 认知名片平台 */

:root {
  /* Font system */
  --cognicard-font-sans: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --cognicard-font-mono: "SF Mono", "JetBrains Mono", "Fira Code", monospace;

  /* Radius scale */
  --cognicard-radius-sm: 4px;
  --cognicard-radius-md: 8px;
  --cognicard-radius-lg: 12px;
  --cognicard-radius-full: 9999px;

  /* Light mode (day / star-map daytime) */
  --cognicard-background: #F6F7F9;
  --cognicard-foreground: #0A0E1A;
  --cognicard-card: #FFFFFF;
  --cognicard-card-foreground: #0A0E1A;
  --cognicard-popover: #FFFFFF;
  --cognicard-popover-foreground: #0A0E1A;
  --cognicard-primary: #1E3A5F;
  --cognicard-primary-foreground: #FFFFFF;
  --cognicard-muted: #E8EBF0;
  --cognicard-muted-foreground: #5A6578;
  --cognicard-border: #D8DCE5;
  --cognicard-input: #FFFFFF;
  --cognicard-ring: #4A9EFF;

  /* Brand tints */
  --cognicard-brand-50: #E8F4FF;
  --cognicard-brand-100: #C7E6FF;
  --cognicard-brand-200: #96D0FF;
  --cognicard-brand-300: #5AB8FF;
  --cognicard-brand-400: #4A9EFF;
  --cognicard-brand-500: #2B8AFC;
  --cognicard-brand-600: #1E6FD1;
  --cognicard-brand-700: #1E3A5F;

  /* Surface scale (dark mode overrides below) */
  --cognicard-surface-base: var(--cognicard-background);
  --cognicard-surface-elevated: var(--cognicard-card);
  --cognicard-surface-highlight: var(--cognicard-muted);

  /* Member / state accents */
  --cognicard-gold: #D4AF37;
  --cognicard-gold-light: #F3E5AB;
  --cognicard-silver: #A8B4C4;

  /* State colors (semantic only) */
  --cognicard-state-success: #22C55E;
  --cognicard-state-warning: #F59E0B;
  --cognicard-state-error: #EF4444;
  --cognicard-state-info: #3B82F6;

  /* Glow / shadow */
  --cognicard-glow-primary: 0 0 24px rgba(74, 158, 255, 0.35);
  --cognicard-glow-gold: 0 0 24px rgba(212, 175, 55, 0.35);
  --cognicard-shadow-sm: 0 1px 2px rgba(10, 14, 26, 0.05);
  --cognicard-shadow-md: 0 8px 24px -8px rgba(10, 14, 26, 0.18);
  --cognicard-shadow-lg: 0 24px 60px -20px rgba(10, 14, 26, 0.30);
}

.dark {
  /* Dark mode (night / tool dashboard / immersive) */
  --cognicard-background: #0A0E1A;
  --cognicard-foreground: #E8ECF5;
  --cognicard-card: #1A2233;
  --cognicard-card-foreground: #E8ECF5;
  --cognicard-popover: #1A2233;
  --cognicard-popover-foreground: #E8ECF5;
  --cognicard-primary: #4A9EFF;
  --cognicard-primary-foreground: #0A0E1A;
  --cognicard-muted: #232D42;
  --cognicard-muted-foreground: #8A96AD;
  --cognicard-border: #2A3A55;
  --cognicard-input: #1A2233;
  --cognicard-ring: #4A9EFF;

  --cognicard-surface-base: var(--cognicard-background);
  --cognicard-surface-elevated: var(--cognicard-card);
  --cognicard-surface-highlight: var(--cognicard-muted);

  --cognicard-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.20);
  --cognicard-shadow-md: 0 8px 24px -8px rgba(0, 0, 0, 0.40);
  --cognicard-shadow-lg: 0 24px 60px -20px rgba(0, 0, 0, 0.55);
}

/* Typography utilities */

<body class="min-h-screen font-sans antialiased">
    <div class="star-field" aria-hidden="true"><canvas id="star-canvas"></canvas></div>

    <main class="relative z-10 flex min-h-screen flex-col items-center justify-center px-6 py-10">
      <div class="w-full max-w-[360px]">
        <!-- Brand wordmark -->
        <div class="mb-8 flex flex-col items-center text-center">
          <div class="wordmark-shimmer mb-3 flex items-center gap-2 text-[var(--cognicard-primary)]">
            <i data-lucide="sparkles" class="h-7 w-7"></i>
            <span class="text-2xl font-semibold tracking-tight text-[var(--cognicard-foreground)]">CogniCard</span>
          </div>
          <p class="text-sm text-[var(--cognicard-muted-foreground)]">你的认知名片，从登录开始</p>
        </div>

        <!-- Login / register card -->
        <section
          class="rounded-[12px] border border-[var(--cognicard-border)] bg-[var(--cognicard-card)] p-6 shadow-lg"
          style="box-shadow: var(--cognicard-shadow-lg);"
        >
          <h1 class="mb-5 text-lg font-semibold text-[var(--cognicard-card-foreground)]">登录 / 注册</h1>

          <form id="login-form" class="space-y-4" onsubmit="return false;">
            <!-- Phone input -->
            <div>
              <label for="input-phone" class="mb-1.5 block text-sm font-medium text-[var(--cognicard-card-foreground)]">手机号</label>
              <div class="flex overflow-hidden rounded-[var(--cognicard-radius-md)] border border-[var(--cognicard-border)] bg-[var(--cognicard-input)] focus-within:border-[var(--cognicard-primary)] focus-within:shadow-[0_0_0_3px_rgba(74,158,255,0.22)]">
                <span class="flex items-center border-r border-[var(--cognicard-border)] px-3 text-sm text-[var(--cognicard-muted-foreground)]">
                  <i data-lucide="smartphone" class="mr-1.5 h-4 w-4"></i>+86

                <input
                  id="input-phone"
                  data-dom-id="input-phone"

            <!-- Code input -->
            <div>
              <label for="input-code" class="mb-1.5 block text-sm font-medium text-[var(--cognicard-card-foreground)]">验证码</label>

                  <span class="flex items-center border-r border-[var(--cognicard-border)] px-3 text-[var(--cognicard-muted-foreground)]">
                    <i data-lucide="shield-check" class="h-4 w-4"></i>
                  </span>
                  <input
                    id="input-code"
                    data-dom-id="input-code"
                    type="text"
                    maxlength="6"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    placeholder="6 位验证码"
                    class="login-input w-full bg-transparent px-3 py-3 text-base"
                  />
                </div>
                <button
                  id="btn-send-code"
                  data-dom-id="btn-send-code"
                  type="button"

          登录即代表同意《用户协议》与《隐私政策》<br/>未注册手机号验证通过后将自动创建账号

    <script>
      // Initialize Lucide icons
      lucide.createIcons();

      // Star-field backdrop (subtle, non-competing)
      (function initStarField() {
        const canvas = document.getElementById('star-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let width, height, stars = [];
        const STAR_COUNT = 70;

        function resize() {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        }
        function createStars() {
          stars = [];
          for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({
              x: Math.random() * width,
              y: Math.random() * height,
              r: Math.random() * 1.2 + 0.4,
              alpha: Math.random() * 0.5 + 0.2,
              speed: Math.random() * 0.3 + 0.05,
              twinkle: Math.random() * 0.02 + 0.005,
              phase: Math.random() * Math.PI * 2
            });
          }
        }
        function draw() {
          ctx.clearRect(0, 0, width, height);
          const time = Date.now() * 0.001;
          stars.forEach(star => {
            const alpha = star.alpha + Math.sin(time * 2 + star.phase) * star.twinkle * 10;
            const safeAlpha = Math.max(0.1, Math.min(0.75, alpha));
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(200, 215, 255, ${safeAlpha})`;
            ctx.fill();
            // Slight drift
            star.y -= star.speed;
            if (star.y < -2) star.y = height + 2;
          });
          requestAnimationFrame(draw);
        }
        resize();
        createStars();
        window.addEventListener('resize', () => { resize(); createStars(); });
        draw();
      })();

      // Form interactions
      (function initForm() {
        const phoneInput = document.getElementById('input-phone');
        const codeInput = document.getElementById('input-code');
        const sendCodeBtn = document.getElementById('btn-send-code');
        const loginBtn = document.getElementById('btn-login');
        const switchLink = document.getElementById('link-switch-register');
        const modeHint = document.getElementById('mode-hint');
        const phoneError = document.getElementById('phone-error');
        const codeError = document.getElementById('code-error');

        let isRegisterMode = false;
        let countdown = 0;
        let timer = null;

        function isValidPhone(v) {
          return /^1[3-9]\d{9}$/.test(v);
        }
        function isValidCode(v) {
          return /^\d{6}$/.test(v);
        }
        function restrictDigits(el) {
          el.value = el.value.replace(/\D/g, '');
        }

        phoneInput.addEventListener('input', () => {
          restrictDigits(phoneInput);
          phoneError.classList.add('hidden');
        });
        codeInput.addEventListener('input', () => {
          restrictDigits(codeInput);
          codeError.classList.add('hidden');
        });

        function startCountdown() {
          countdown = 60;
          sendCodeBtn.disabled = true;
          sendCodeBtn.textContent = `${countdown}s 后重发`;
          timer = setInterval(() => {
            countdown--;
            if (countdown <= 0) {
              clearInterval(timer);
              sendCodeBtn.disabled = false;
              sendCodeBtn.textContent = '发送验证码';
            } else {
              sendCodeBtn.textContent = `${countdown}s 后重发`;
            }
          }, 1000);
        }

        sendCodeBtn.addEventListener('click', () => {
          const phone = phoneInput.value.trim();
          if (!isValidPhone(phone)) {
            phoneError.classList.remove('hidden');
            phoneInput.focus();
            return;
          }
          startCountdown();
          // TODO: wire to /auth/send_code
        });

        loginBtn.addEventListener('click', () => {
          const phone = phoneInput.value.trim();
          const code = codeInput.value.trim();
          let valid = true;
          if (!isValidPhone(phone)) {
            phoneError.classList.remove('hidden');
            valid = false;
          }
          if (!isValidCode(code)) {
            codeError.classList.remove('hidden');
            valid = false;
          }
          if (!valid) return;
          // TODO: wire to /auth/login or /auth/register
          // Navigate to index (star map) on success
          window.location.href = 'index.html';
        });

        switchLink.addEventListener('click', () => {
          isRegisterMode = !isRegisterMode;
          if (isRegisterMode) {
            modeHint.textContent = '已有账号？';
            switchLink.textContent = '切换登录模式';
            loginBtn.textContent = '注册并登录';
          } else {
            modeHint.textContent = '还没有账号？';
            switchLink.textContent = '切换注册模式';
            loginBtn.textContent = '登录 / 注册';
          }
        });
      })();
    </script>
</body>
</html>
