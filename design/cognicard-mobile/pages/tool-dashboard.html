<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人工具台</title>
    <style id="theme-vars">
/* CogniCard Design Tokens — 认知名片平台 */

:root {
  /* Font system */
  --cognicard-font-sans: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --cognicard-font-mono: "SF Mono", "JetBrains Mono", "Fira Code", monospace;

  /* Radius scale */
  --cognicard-radius-sm: 4px;
  --cognicard-radius-md: 8px;
  --cognicard-radius-lg: 12px;
  --cognicard-radius-full: 9999px;

  /* Light mode (day / star-map daytime) */
  --cognicard-background: #F6F7F9;
  --cognicard-foreground: #0A0E1A;
  --cognicard-card: #FFFFFF;
  --cognicard-card-foreground: #0A0E1A;
  --cognicard-popover: #FFFFFF;
  --cognicard-popover-foreground: #0A0E1A;
  --cognicard-primary: #1E3A5F;
  --cognicard-primary-foreground: #FFFFFF;
  --cognicard-muted: #E8EBF0;
  --cognicard-muted-foreground: #5A6578;
  --cognicard-border: #D8DCE5;
  --cognicard-input: #FFFFFF;
  --cognicard-ring: #4A9EFF;

  /* Brand tints */
  --cognicard-brand-50: #E8F4FF;
  --cognicard-brand-100: #C7E6FF;
  --cognicard-brand-200: #96D0FF;
  --cognicard-brand-300: #5AB8FF;
  --cognicard-brand-400: #4A9EFF;
  --cognicard-brand-500: #2B8AFC;
  --cognicard-brand-600: #1E6FD1;
  --cognicard-brand-700: #1E3A5F;

  /* Surface scale (dark mode overrides below) */
  --cognicard-surface-base: var(--cognicard-background);
  --cognicard-surface-elevated: var(--cognicard-card);
  --cognicard-surface-highlight: var(--cognicard-muted);

  /* Member / state accents */
  --cognicard-gold: #D4AF37;
  --cognicard-gold-light: #F3E5AB;
  --cognicard-silver: #A8B4C4;

  /* State colors (semantic only) */
  --cognicard-state-success: #22C55E;
  --cognicard-state-warning: #F59E0B;
  --cognicard-state-error: #EF4444;
  --cognicard-state-info: #3B82F6;

  /* Glow / shadow */
  --cognicard-glow-primary: 0 0 24px rgba(74, 158, 255, 0.35);
  --cognicard-glow-gold: 0 0 24px rgba(212, 175, 55, 0.35);
  --cognicard-shadow-sm: 0 1px 2px rgba(10, 14, 26, 0.05);
  --cognicard-shadow-md: 0 8px 24px -8px rgba(10, 14, 26, 0.18);
  --cognicard-shadow-lg: 0 24px 60px -20px rgba(10, 14, 26, 0.30);
}

.dark {
  /* Dark mode (night / tool dashboard / immersive) */
  --cognicard-background: #0A0E1A;
  --cognicard-foreground: #E8ECF5;
  --cognicard-card: #1A2233;
  --cognicard-card-foreground: #E8ECF5;
  --cognicard-popover: #1A2233;
  --cognicard-popover-foreground: #E8ECF5;
  --cognicard-primary: #4A9EFF;
  --cognicard-primary-foreground: #0A0E1A;
  --cognicard-muted: #232D42;
  --cognicard-muted-foreground: #8A96AD;
  --cognicard-border: #2A3A55;
  --cognicard-input: #1A2233;
  --cognicard-ring: #4A9EFF;

  --cognicard-surface-base: var(--cognicard-background);
  --cognicard-surface-elevated: var(--cognicard-card);
  --cognicard-surface-highlight: var(--cognicard-muted);

  --cognicard-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.20);
  --cognicard-shadow-md: 0 8px 24px -8px rgba(0, 0, 0, 0.40);
  --cognicard-shadow-lg: 0 24px 60px -20px rgba(0, 0, 0, 0.55);
}

/* Typography utilities */
.cognicard-display {
  font-family: var(--cognicard-font-sans);
  font-size: clamp(40px, 6vw, 88px);
  line-height: 1.02;
  font-weight: 600;
  letter-spacing: -0.03em;
}

.cognicard-h1 {
  font-family: var(--cognicard-font-sans);
  font-size: clamp(28px, 3.5vw, 48px);
  line-height: 1.1;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.cognicard-h2 {
  font-family: var(--cognicard-font-sans);
  font-size: clamp(22px, 2.4vw, 32px);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.015em;
}

.cognicard-h3 {
  font-family: var(--cognicard-font-sans);
  font-size: 20px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.cognicard-body {
  font-family: var(--cognicard-font-sans);
  font-size: 15px;
  line-height: 1.6;
  font-weight: 400;
}

.cognicard-body-lg {
  font-family: var(--cognicard-font-sans);
  font-size: 17px;
  line-height: 1.55;
  font-weight: 400;
}

.cognicard-caption {
  font-family: var(--cognicard-font-sans);
  font-size: 13px;
  line-height: 1.5;
  font-weight: 400;
}

.cognicard-mono {
  font-family: var(--cognicard-font-mono);
  font-size: 13px;
  line-height: 1.5;
  font-weight: 500;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--cognicard-background);
    --color-foreground: var(--cognicard-foreground);
    --color-card: var(--cognicard-card);
    --color-card-foreground: var(--cognicard-card-foreground);
    --color-popover: var(--cognicard-popover);
    --color-popover-foreground: var(--cognicard-popover-foreground);
    --color-primary: var(--cognicard-primary);
    --color-primary-foreground: var(--cognicard-primary-foreground);
    --color-muted: var(--cognicard-muted);
    --color-muted-foreground: var(--cognicard-muted-foreground);
    --color-border: var(--cognicard-border);
    --color-input: var(--cognicard-input);
    --color-ring: var(--cognicard-ring);
    --radius-sm: var(--cognicard-radius-sm);
    --radius-md: var(--cognicard-radius-md);
    --radius-lg: var(--cognicard-radius-lg);
  }
  @layer base {
    body { background: var(--cognicard-background); color: var(--cognicard-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .text-background { color: var(--cognicard-background); }
      .border-background { border-color: var(--cognicard-background); }
      .ring-background { --tw-ring-color: var(--cognicard-background); }
      .bg-foreground { background-color: var(--cognicard-foreground); }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

<body class="min-h-screen font-sans antialiased bg-background text-foreground">
    <div class="min-h-screen flex flex-col max-w-md mx-auto">
        <!-- Header -->
        <header class="flex items-center justify-between px-4 pt-4 pb-3">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 rounded-full bg-muted border border-border flex items-center justify-center overflow-hidden shrink-0">
                    <i data-lucide="user" class="w-5 h-5 text-muted-foreground"></i>
                </div>
                <div class="min-w-0">
                    <h1 class="text-base font-semibold truncate">张三</h1>
                    <p class="text-xs text-muted-foreground truncate">长期主义者</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button type="button" class="w-9 h-9 rounded-lg bg-card border border-border flex items-center justify-center text-muted-foreground" aria-label="搜索">
                    <i data-lucide="search" class="w-5 h-5"></i>
                </button>
                <button type="button" class="w-9 h-9 rounded-lg bg-card border border-border flex items-center justify-center text-muted-foreground" aria-label="设置">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <main class="flex-1 px-4 pb-4 space-y-4 overflow-y-auto no-scrollbar">
            <!-- Pending digest alert banner -->
            <section class="relative overflow-hidden rounded-xl border border-border bg-card p-4" style="background: linear-gradient(135deg, rgba(30,58,95,0.55) 0%, rgba(26,34,51,0.95) 100%);">
                <div class="absolute top-0 right-0 w-24 h-24 bg-primary/20 rounded-full blur-2xl -translate-y-1/2 translate-x-1/2"></div>
                <div class="relative flex items-start justify-between gap-3">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-1.5">
                            <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-primary/20 text-primary">
                                <i data-lucide="bell" class="w-3 h-3"></i>
                            </span>
                            <span class="text-xs font-medium text-primary">今日待消化</span>
                        </div>
                        <p class="text-[15px] font-semibold text-card-foreground">你有 3 条素材等待内化</p>
                        <p class="text-xs text-muted-foreground mt-1">完成消化才能让它们进入知识库</p>
                    </div>
                    <button type="button" id="btn-go-digest" data-dom-id="btn-go-digest" class="shrink-0 inline-flex items-center gap-1 px-3 py-2 rounded-lg bg-primary text-primary-foreground text-xs font-medium">
                        去消化
                        <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </section>

            <!-- Quick entry tiles -->
            <section class="grid grid-cols-2 gap-3">
                <a href="#" id="entry-materials" data-dom-id="entry-materials" class="group flex flex-col justify-between rounded-xl border border-border bg-card p-4 h-[88px] transition-colors hover:border-primary/40">
                    <div class="flex items-center justify-between">
                        <span class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-[var(--cognicard-brand-700)]/30 text-primary">
                            <i data-lucide="package" class="w-5 h-5"></i>
                        </span>
                        <span class="text-lg font-semibold text-card-foreground">12</span>
                    </div>
                    <span class="text-sm font-medium text-card-foreground">素材池</span>
                </a>
                <a href="#" id="entry-knowledge" data-dom-id="entry-knowledge" class="group flex flex-col justify-between rounded-xl border border-border bg-card p-4 h-[88px] transition-colors hover:border-primary/40">
                    <div class="flex items-center justify-between">
                        <span class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-primary/15 text-primary">
                            <i data-lucide="brain" class="w-5 h-5"></i>
                        </span>
                        <span class="text-lg font-semibold text-card-foreground">32</span>
                    </div>
                    <span class="text-sm font-medium text-card-foreground">知识库</span>
                </a>
                <a href="#" id="entry-iterations" data-dom-id="entry-iterations" class="group flex flex-col justify-between rounded-xl border border-border bg-card p-4 h-[88px] transition-colors hover:border-primary/40">
                    <div class="flex items-center justify-between">
                        <span class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-[var(--cognicard-state-warning)]/15 text-[var(--cognicard-state-warning)]">
                            <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                        </span>
                        <span class="text-lg font-semibold text-card-foreground">3</span>
                    </div>
                    <span class="text-sm font-medium text-card-foreground">迭代提醒</span>
                </a>
                <a href="#" id="entry-dashboard" data-dom-id="entry-dashboard" class="group flex flex-col justify-between rounded-xl border border-border bg-card p-4 h-[88px] transition-colors hover:border-primary/40">
                    <div class="flex items-center justify-between">
                        <span class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-[var(--cognicard-state-success)]/15 text-[var(--cognicard-state-success)]">
                            <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
                        </span>
                        <span class="text-lg font-semibold text-card-foreground">—</span>
                    </div>
                    <span class="text-sm font-medium text-card-foreground">数据看板</span>
                </a>
            </section>

            <!-- Recent activity feed -->
            <section class="rounded-xl border border-border bg-card p-4">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-sm font-semibold text-card-foreground">最近操作</h2>
                    <button type="button" class="text-xs text-primary font-medium">查看全部</button>
                </div>
                <ul class="space-y-3">
                    <li class="flex gap-3">
                        <div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center shrink-0 mt-0.5">
                            <i data-lucide="sparkles" class="w-4 h-4 text-primary"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm text-card-foreground truncate">消化了《AI 时代的产品思维》</p>
                            <p class="text-xs text-muted-foreground mt-0.5">30 分钟前</p>
                        </div>
                    </li>
                    <li class="flex gap-3">
                        <div class="w-8 h-8 rounded-full bg-[var(--cognicard-state-success)]/10 flex items-center justify-center shrink-0 mt-0.5">
                            <i data-lucide="recycle" class="w-4 h-4 text-[var(--cognicard-state-success)]"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm text-card-foreground truncate">复用了「客户信任」</p>
                            <p class="text-xs text-muted-foreground mt-0.5">2 小时前</p>
                        </div>
                    </li>
                    <li class="flex gap-3">
                        <div class="w-8 h-8 rounded-full bg-[var(--cognicard-state-warning)]/10 flex items-center justify-center shrink-0 mt-0.5">
                            <i data-lucide="git-branch" class="w-4 h-4 text-[var(--cognicard-state-warning)]"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm text-card-foreground truncate">迭代了「开会方法」</p>
                            <p class="text-xs text-muted-foreground mt-0.5">昨天</p>
                        </div>
                    </li>
                </ul>
            </section>
        </main>

        <!-- Bottom tab navigation -->
        <nav data-mobile-nav="global" class="w-full h-[56px] border-t border-[var(--cognicard-border)] bg-[var(--cognicard-background)]/95 backdrop-blur"><div class="w-full max-w-md mx-auto grid grid-cols-4 h-full"><a href="#" data-nav-key="starmap" data-dom-id="nav-starmap" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--cognicard-muted-foreground)]"><i data-lucide="globe" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">星图</span></a><a href="#" data-nav-key="toolbox" data-active="true" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--cognicard-primary)] font-medium"><i data-lucide="briefcase" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">工具台</span></a><a href="#" data-nav-key="messages" data-dom-id="nav-messages" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--cognicard-muted-foreground)]"><i data-lucide="bell" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">消息</span></a><a href="#" data-nav-key="me" data-dom-id="nav-me" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--cognicard-muted-foreground)]"><i data-lucide="user" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">我的</span></a></div></nav>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
