<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沉淀知识原子</title>
    <style id="theme-vars">
/* CogniCard Design Tokens — 认知名片平台 */

:root {
  /* Font system */
  --cognicard-font-sans: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --cognicard-font-mono: "SF Mono", "JetBrains Mono", "Fira Code", monospace;

  /* Radius scale */
  --cognicard-radius-sm: 4px;
  --cognicard-radius-md: 8px;
  --cognicard-radius-lg: 12px;
  --cognicard-radius-full: 9999px;

  /* Light mode (day / star-map daytime) */
  --cognicard-background: #F6F7F9;
  --cognicard-foreground: #0A0E1A;
  --cognicard-card: #FFFFFF;
  --cognicard-card-foreground: #0A0E1A;
  --cognicard-popover: #FFFFFF;
  --cognicard-popover-foreground: #0A0E1A;
  --cognicard-primary: #1E3A5F;
  --cognicard-primary-foreground: #FFFFFF;
  --cognicard-muted: #E8EBF0;
  --cognicard-muted-foreground: #5A6578;
  --cognicard-border: #D8DCE5;
  --cognicard-input: #FFFFFF;
  --cognicard-ring: #4A9EFF;

  /* Brand tints */
  --cognicard-brand-50: #E8F4FF;
  --cognicard-brand-100: #C7E6FF;
  --cognicard-brand-200: #96D0FF;
  --cognicard-brand-300: #5AB8FF;
  --cognicard-brand-400: #4A9EFF;
  --cognicard-brand-500: #2B8AFC;
  --cognicard-brand-600: #1E6FD1;
  --cognicard-brand-700: #1E3A5F;

  /* Surface scale (dark mode overrides below) */
  --cognicard-surface-base: var(--cognicard-background);
  --cognicard-surface-elevated: var(--cognicard-card);
  --cognicard-surface-highlight: var(--cognicard-muted);

  /* Member / state accents */
  --cognicard-gold: #D4AF37;
  --cognicard-gold-light: #F3E5AB;
  --cognicard-silver: #A8B4C4;

  /* State colors (semantic only) */
  --cognicard-state-success: #22C55E;
  --cognicard-state-warning: #F59E0B;
  --cognicard-state-error: #EF4444;
  --cognicard-state-info: #3B82F6;

  /* Glow / shadow */
  --cognicard-glow-primary: 0 0 24px rgba(74, 158, 255, 0.35);
  --cognicard-glow-gold: 0 0 24px rgba(212, 175, 55, 0.35);
  --cognicard-shadow-sm: 0 1px 2px rgba(10, 14, 26, 0.05);
  --cognicard-shadow-md: 0 8px 24px -8px rgba(10, 14, 26, 0.18);
  --cognicard-shadow-lg: 0 24px 60px -20px rgba(10, 14, 26, 0.30);
}

.dark {
  /* Dark mode (night / tool dashboard / immersive) */
  --cognicard-background: #0A0E1A;
  --cognicard-foreground: #E8ECF5;
  --cognicard-card: #1A2233;
  --cognicard-card-foreground: #E8ECF5;
  --cognicard-popover: #1A2233;
  --cognicard-popover-foreground: #E8ECF5;
  --cognicard-primary: #4A9EFF;
  --cognicard-primary-foreground: #0A0E1A;
  --cognicard-muted: #232D42;
  --cognicard-muted-foreground: #8A96AD;
  --cognicard-border: #2A3A55;
  --cognicard-input: #1A2233;
  --cognicard-ring: #4A9EFF;

  --cognicard-surface-base: var(--cognicard-background);
  --cognicard-surface-elevated: var(--cognicard-card);
  --cognicard-surface-highlight: var(--cognicard-muted);

  --cognicard-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.20);
  --cognicard-shadow-md: 0 8px 24px -8px rgba(0, 0, 0, 0.40);
  --cognicard-shadow-lg: 0 24px 60px -20px rgba(0, 0, 0, 0.55);
}

/* Typography utilities */
.cognicard-display {
  font-family: var(--cognicard-font-sans);
  font-size: clamp(40px, 6vw, 88px);
  line-height: 1.02;
  font-weight: 600;
  letter-spacing: -0.03em;
}

.cognicard-h1 {
  font-family: var(--cognicard-font-sans);
  font-size: clamp(28px, 3.5vw, 48px);
  line-height: 1.1;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.cognicard-h2 {
  font-family: var(--cognicard-font-sans);
  font-size: clamp(22px, 2.4vw, 32px);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.015em;
}

.cognicard-h3 {
  font-family: var(--cognicard-font-sans);
  font-size: 20px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.cognicard-body {
  font-family: var(--cognicard-font-sans);
  font-size: 15px;
  line-height: 1.6;
  font-weight: 400;
}

.cognicard-body-lg {
  font-family: var(--cognicard-font-sans);
  font-size: 17px;
  line-height: 1.55;
  font-weight: 400;
}

.cognicard-caption {
  font-family: var(--cognicard-font-sans);
  font-size: 13px;
  line-height: 1.5;
  font-weight: 400;
}

.cognicard-mono {
  font-family: var(--cognicard-font-mono);
  font-size: 13px;
  line-height: 1.5;
  font-weight: 500;
}

    </style>

    <style type="text/tailwindcss">

  }

<body class="min-h-screen font-sans antialiased bg-background text-foreground">
    <!-- Header -->
    <header class="sticky top-0 z-30 w-full border-b border-border bg-background/95 backdrop-blur">
        <div class="w-full max-w-md mx-auto h-[52px] flex items-center justify-between px-4">
            <a href="#" data-dom-id="btn-back" class="inline-flex items-center justify-center w-9 h-9 -ml-2 rounded-md text-muted-foreground hover:bg-muted hover:text-foreground transition-colors">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </a>
            <h1 class="text-[17px] font-semibold text-foreground">沉淀知识原子</h1>
            <div class="w-9"></div>
        </div>
    </header>

    <main class="w-full max-w-md mx-auto px-4 pt-4 pb-[132px]">
        <!-- Source material hint (optional, shows continuity from digest) -->
        <section class="mb-4 rounded-xl border border-border bg-card p-4 shadow-sm">
            <div class="flex items-start gap-3">
                <div class="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-muted text-muted-foreground">
                    <i data-lucide="file-text" class="w-4 h-4"></i>
                </div>
                <div class="min-w-0 flex-1">
                    <p class="text-[13px] font-medium text-foreground">来自素材：如何建立客户信任？</p>
                    <p class="text-[12px] text-muted-foreground line-clamp-2 mt-0.5">原文探讨了 AI 时代下，信任建立的关键要素与实践路径。</p>
                </div>
            </div>
        </section>

        <!-- Core card format -->
        <section class="mb-4 rounded-xl border border-border bg-card p-4 shadow-sm">
            <div class="flex items-center gap-2 mb-4">
                <i data-lucide="id-card" class="w-4 h-4 text-primary"></i>
                <h2 class="text-[15px] font-semibold text-foreground">核心名片格式</h2>
            </div>

            <div class="space-y-4">
                <div class="space-y-1.5">
                    <label for="core-question" class="flex items-center gap-1 text-[14px] font-medium text-foreground">
                        核心问题
                        <span class="text-[var(--cognicard-state-error)]">*</span>
                    </label>
                    <textarea id="core-question" rows="2" placeholder="这条知识解决什么问题？" class="w-full rounded-lg border border-border bg-input px-3 py-2.5 text-[14px] text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent resize-none"></textarea>
                    <p class="text-[12px] text-muted-foreground">公开原子必填，让访问者一眼抓住问题本质。</p>
                </div>

                <div class="space-y-1.5">
                    <label for="my-viewpoint" class="flex items-center gap-1 text-[14px] font-medium text-foreground">
                        我的观点 / 方案
                        <span class="text-[var(--cognicard-state-error)]">*</span>
                    </label>
                    <textarea id="my-viewpoint" rows="4" placeholder="你对该问题的判断、方法或结论是什么？" class="w-full rounded-lg border border-border bg-input px-3 py-2.5 text-[14px] text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent resize-none"></textarea>
                </div>

                <div class="space-y-1.5">
                    <label for="evidence-source" class="flex items-center gap-1 text-[14px] font-medium text-foreground">
                        证据 / 出处
                        <span class="text-[var(--cognicard-state-error)]">*</span>
                    </label>
                    <div class="flex gap-2">
                        <select id="evidence-source" class="h-[42px] shrink-0 rounded-lg border border-border bg-input px-3 text-[14px] text-foreground focus:outline-none focus:ring-2 focus:ring-ring">
                            <option value="original">原创</option>
                            <option value="book">书籍</option>
                            <option value="article">文章</option>
                            <option value="practice">实践总结</option>
                            <option value="other">其他</option>
                        </select>
                        <input type="text" placeholder="补充来源或说明" class="min-w-0 flex-1 rounded-lg border border-border bg-input px-3 py-2 text-[14px] text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label for="practice-case" class="text-[14px] font-medium text-foreground">实践案例</label>
                    <textarea id="practice-case" rows="3" placeholder="这个观点在真实场景中如何应用与验证？（选填）" class="w-full rounded-lg border border-border bg-input px-3 py-2.5 text-[14px] text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent resize-none"></textarea>
                </div>

                <div class="space-y-1.5">
                    <label class="flex items-center gap-1.5 text-[14px] font-medium text-muted-foreground">
                        <i data-lucide="history" class="w-3.5 h-3.5"></i>
                        迭代记录（系统自动追加）
                    </label>
                    <div class="rounded-lg border border-border bg-muted/50 px-3 py-2.5 text-[13px] text-muted-foreground">
                        暂无迭代记录
                    </div>
                </div>
            </div>
        </section>

        <!-- Classification -->
        <section class="mb-4 rounded-xl border border-border bg-card p-4 shadow-sm">
            <div class="flex items-center gap-2 mb-4">
                <i data-lucide="folder-tree" class="w-4 h-4 text-primary"></i>
                <h2 class="text-[15px] font-semibold text-foreground">分类与标签</h2>
            </div>

            <div class="space-y-4">
                <div class="space-y-1.5">
                    <label for="select-para" class="text-[14px] font-medium text-foreground">PARA 分类</label>
                    <select id="select-para" class="w-full h-[44px] rounded-lg border border-border bg-input px-3 text-[14px] text-foreground focus:outline-none focus:ring-2 focus:ring-ring">
                        <option value="projects">Projects · 项目</option>
                        <option value="areas">Areas · 领域</option>
                        <option value="resources">Resources · 资源</option>
                        <option value="archive">Archive · 归档</option>
                        <option value="skills">Skills · 技能</option>
                    </select>
                </div>

                <div class="space-y-1.5">
                    <label for="input-tags" class="text-[14px] font-medium text-foreground">标签</label>
                    <div class="flex flex-wrap items-center gap-2 rounded-lg border border-border bg-input px-2.5 py-2 focus-within:ring-2 focus-within:ring-ring">
                        <span class="inline-flex items-center gap-1 rounded-full bg-[var(--cognicard-brand-50)] px-2.5 py-1 text-[12px] text-primary">
                            信任
                            <button type="button" class="inline-flex items-center justify-center rounded-full hover:bg-primary/10"><i data-lucide="x" class="w-3 h-3"></i></button>
                        </span>
                        <span class="inline-flex items-center gap-1 rounded-full bg-[var(--cognicard-brand-50)] px-2.5 py-1 text-[12px] text-primary">
                            客户
                            <button type="button" class="inline-flex items-center justify-center rounded-full hover:bg-primary/10"><i data-lucide="x" class="w-3 h-3"></i></button>
                        </span>
                        <input id="input-tags" type="text" placeholder="输入标签，回车添加" class="min-w-[120px] flex-1 bg-transparent px-1 py-1 text-[14px] text-foreground placeholder:text-muted-foreground focus:outline-none">
                    </div>
                </div>
            </div>
        </section>

        <!-- Citations -->
        <section class="mb-4 rounded-xl border border-border bg-card p-4 shadow-sm">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <i data-lucide="link-2" class="w-4 h-4 text-primary"></i>
                    <h2 class="text-[15px] font-semibold text-foreground">引用关联</h2>
                </div>
                <button type="button" id="btn-add-citation" class="inline-flex items-center gap-1 rounded-md bg-muted px-2.5 py-1.5 text-[13px] font-medium text-primary hover:bg-muted/80 transition-colors">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    引用他人原子
                </button>
            </div>
            <div class="space-y-2">
                <div class="flex items-start gap-3 rounded-lg border border-border bg-muted/40 p-3">
                    <i data-lucide="quote" class="mt-0.5 w-4 h-4 text-muted-foreground"></i>
                    <div class="min-w-0 flex-1">
                        <p class="text-[13px] font-medium text-foreground truncate">关于客户信任</p>
                        <p class="text-[12px] text-muted-foreground">张三 · 公开原子</p>
                    </div>
                    <span class="shrink-0 rounded-full bg-muted px-2 py-0.5 text-[11px] text-muted-foreground">不可删除</span>
                </div>
            </div>
        </section>

        <!-- Visibility -->
        <section class="mb-4 rounded-xl border border-border bg-card p-4 shadow-sm">
            <div class="flex items-center gap-2 mb-3">
                <i data-lucide="shield" class="w-4 h-4 text-primary"></i>
                <h2 class="text-[15px] font-semibold text-foreground">可见权限</h2>
            </div>

            <div class="space-y-2">
                <label class="flex cursor-pointer items-center gap-3 rounded-lg border border-border bg-input p-3 has-[:checked]:border-primary has-[:checked]:bg-[var(--cognicard-brand-50)] transition-colors">
                    <input type="radio" name="visibility" id="visibility-private" value="private" checked class="h-4 w-4 accent-primary">
                    <div class="flex-1">
                        <div class="flex items-center gap-2">
                            <i data-lucide="lock" class="w-4 h-4 text-foreground"></i>
                            <span class="text-[14px] font-medium text-foreground">私有</span>
                        </div>
                        <p class="text-[12px] text-muted-foreground mt-0.5">仅自己可见，他人无法申请访问。</p>
                    </div>
                </label>

                <label class="flex cursor-pointer items-center gap-3 rounded-lg border border-border bg-input p-3 has-[:checked]:border-primary has-[:checked]:bg-[var(--cognicard-brand-50)] transition-colors">
                    <input type="radio" name="visibility" id="visibility-authorized" value="authorized" class="h-4 w-4 accent-primary">
                    <div class="flex-1">
                        <div class="flex items-center gap-2">
                            <i data-lucide="key" class="w-4 h-4 text-foreground"></i>
                            <span class="text-[14px] font-medium text-foreground">授权可见</span>
                        </div>
                        <p class="text-[12px] text-muted-foreground mt-0.5">他人可申请查看，你拥有完全控制权。</p>
                    </div>
                </label>

                <label class="flex cursor-pointer items-center gap-3 rounded-lg border border-border bg-input p-3 has-[:checked]:border-primary has-[:checked]:bg-[var(--cognicard-brand-50)] transition-colors">
                    <input type="radio" name="visibility" id="visibility-public" value="public" class="h-4 w-4 accent-primary">
                    <div class="flex-1">
                        <div class="flex items-center gap-2">
                            <i data-lucide="globe" class="w-4 h-4 text-foreground"></i>
                            <span class="text-[14px] font-medium text-foreground">完全公开</span>
                        </div>
                        <p class="text-[12px] text-muted-foreground mt-0.5">进入你的认知名片，任何人可见。</p>
                    </div>
                </label>
            </div>

            <div class="mt-3 flex items-start gap-2 rounded-lg bg-[var(--cognicard-brand-50)] px-3 py-2.5">
                <i data-lucide="info" class="mt-0.5 w-4 h-4 shrink-0 text-primary"></i>
                <p class="text-[12px] leading-relaxed text-primary">保存并公开前，系统会校验「核心问题 / 我的观点 / 证据出处」三项必填字段。</p>
            </div>
        </section>
    </main>

    <!-- Sticky bottom action bar -->
    <div class="fixed bottom-[56px] left-0 right-0 z-40 w-full border-t border-border bg-background/95 backdrop-blur">
        <div class="w-full max-w-md mx-auto px-4 py-3 flex gap-3">
            <button type="button" id="btn-save-draft" class="flex-1 h-[44px] rounded-lg border border-border bg-card text-[14px] font-medium text-foreground hover:bg-muted transition-colors">
                保存为草稿
            </button>
            <button type="button" id="btn-publish" class="flex-1 h-[44px] rounded-lg bg-primary text-[14px] font-medium text-primary-foreground shadow-md hover:opacity-90 transition-opacity">
                保存并公开
            </button>
        </div>
    </div>

    <!-- Bottom navigation -->
    <nav data-mobile-nav="global" class="w-full h-[56px] border-t border-[var(--cognicard-border)] bg-[var(--cognicard-background)]/95 backdrop-blur"><div class="w-full max-w-md mx-auto grid grid-cols-4 h-full"><a href="#" data-nav-key="starmap" data-dom-id="nav-starmap" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--cognicard-muted-foreground)]"><i data-lucide="globe" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">星图</span></a><a href="#" data-nav-key="toolbox" data-active="true" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--cognicard-primary)] font-medium"><i data-lucide="briefcase" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">工具台</span></a><a href="#" data-nav-key="messages" data-dom-id="nav-messages" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--cognicard-muted-foreground)]"><i data-lucide="bell" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">消息</span></a><a href="#" data-nav-key="me" data-dom-id="nav-me" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--cognicard-muted-foreground)]"><i data-lucide="user" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">我的</span></a></div></nav>

    <script>lucide.createIcons();</script>
</body>
</html>
