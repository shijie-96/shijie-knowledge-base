    <style id="theme-vars">
/* CogniCard Design Tokens — 认知名片平台 */

:root {
  /* Font system */
  --cognicard-font-sans: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --cognicard-font-mono: "SF Mono", "JetBrains Mono", "Fira Code", monospace;

  /* Radius scale */
  --cognicard-radius-sm: 4px;
  --cognicard-radius-md: 8px;
  --cognicard-radius-lg: 12px;
  --cognicard-radius-full: 9999px;

  /* Light mode (day / star-map daytime) */
  --cognicard-background: #F6F7F9;
  --cognicard-foreground: #0A0E1A;
  --cognicard-card: #FFFFFF;
  --cognicard-card-foreground: #0A0E1A;
  --cognicard-popover: #FFFFFF;
  --cognicard-popover-foreground: #0A0E1A;
  --cognicard-primary: #1E3A5F;
  --cognicard-primary-foreground: #FFFFFF;
  --cognicard-muted: #E8EBF0;
  --cognicard-muted-foreground: #5A6578;
  --cognicard-border: #D8DCE5;
  --cognicard-input: #FFFFFF;
  --cognicard-ring: #4A9EFF;

  /* Brand tints */
  --cognicard-brand-50: #E8F4FF;
  --cognicard-brand-100: #C7E6FF;
  --cognicard-brand-200: #96D0FF;
  --cognicard-brand-300: #5AB8FF;
  --cognicard-brand-400: #4A9EFF;
  --cognicard-brand-500: #2B8AFC;
  --cognicard-brand-600: #1E6FD1;
  --cognicard-brand-700: #1E3A5F;

  /* Surface scale (dark mode overrides below) */
  --cognicard-surface-base: var(--cognicard-background);
  --cognicard-surface-elevated: var(--cognicard-card);
  --cognicard-surface-highlight: var(--cognicard-muted);

  /* Member / state accents */
  --cognicard-gold: #D4AF37;
  --cognicard-gold-light: #F3E5AB;
  --cognicard-silver: #A8B4C4;

  /* State colors (semantic only) */
  --cognicard-state-success: #22C55E;
  --cognicard-state-warning: #F59E0B;
  --cognicard-state-error: #EF4444;
  --cognicard-state-info: #3B82F6;

  /* Glow / shadow */
  --cognicard-glow-primary: 0 0 24px rgba(74, 158, 255, 0.35);
  --cognicard-glow-gold: 0 0 24px rgba(212, 175, 55, 0.35);
  --cognicard-shadow-sm: 0 1px 2px rgba(10, 14, 26, 0.05);
  --cognicard-shadow-md: 0 8px 24px -8px rgba(10, 14, 26, 0.18);
  --cognicard-shadow-lg: 0 24px 60px -20px rgba(10, 14, 26, 0.30);
}

.dark {
  /* Dark mode (night / tool dashboard / immersive) */
  --cognicard-background: #0A0E1A;
  --cognicard-foreground: #E8ECF5;
  --cognicard-card: #1A2233;
  --cognicard-card-foreground: #E8ECF5;
  --cognicard-popover: #1A2233;
  --cognicard-popover-foreground: #E8ECF5;
  --cognicard-primary: #4A9EFF;
  --cognicard-primary-foreground: #0A0E1A;
  --cognicard-muted: #232D42;
  --cognicard-muted-foreground: #8A96AD;
  --cognicard-border: #2A3A55;
  --cognicard-input: #1A2233;
  --cognicard-ring: #4A9EFF;

  --cognicard-surface-base: var(--cognicard-background);
  --cognicard-surface-elevated: var(--cognicard-card);
  --cognicard-surface-highlight: var(--cognicard-muted);

  --cognicard-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.20);
  --cognicard-shadow-md: 0 8px 24px -8px rgba(0, 0, 0, 0.40);
  --cognicard-shadow-lg: 0 24px 60px -20px rgba(0, 0, 0, 0.55);
}

/* Typography utilities */
.cognicard-display {
  font-family: var(--cognicard-font-sans);
  font-size: clamp(40px, 6vw, 88px);
  line-height: 1.02;
  font-weight: 600;
  letter-spacing: -0.03em;
}

.cognicard-h1 {
  font-family: var(--cognicard-font-sans);

  line-height: 1.1;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.cognicard-h2 {
  font-family: var(--cognicard-font-sans);
  font-size: clamp(22px, 2.4vw, 32px);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.015em;
}

.cognicard-h3 {
  font-family: var(--cognicard-font-sans);
  font-size: 20px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.cognicard-body {
  font-family: var(--cognicard-font-sans);
  font-size: 15px;
  line-height: 1.6;
  font-weight: 400;
}

.cognicard-body-lg {

  line-height: 1.55;
  font-weight: 400;
}

.cognicard-caption {
  font-family: var(--cognicard-font-sans);
  font-size: 13px;
  line-height: 1.5;
  font-weight: 400;
}

.cognicard-mono {
  font-family: var(--cognicard-font-mono);
  font-size: 13px;
  line-height: 1.5;
  font-weight: 500;
}

    <script>
      (function(){
        // Initialize Lucide icons
        if (window.lucide) lucide.createIcons();

        // Clock updater
        const clock = document.getElementById('clock-time');
        function updateClock(){
          const now = new Date();
          clock.textContent = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        }
        updateClock();
        setInterval(updateClock, 60000);

        // Starfield canvas
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let width, height, dpr;
        const stars = [];
        const particles = [];
        const connections = [];
        const STAR_COUNT = 140;
        const CONNECTION_DISTANCE = 120;
        const MAX_CONNECTIONS = 50;

        function resize(){
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          canvas.style.width = width + 'px';
          canvas.style.height = height + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          initStars();
        }

        function initStars(){
          stars.length = 0;
          for(let i=0;i<STAR_COUNT;i++){
            stars.push({
              x: Math.random() * width,
              y: Math.random() * height,
              r: Math.random() * 1.3 + 0.3,
              alpha: Math.random() * 0.6 + 0.2,
              twinkle: Math.random() * 0.02 + 0.005,
              phase: Math.random() * Math.PI * 2
            });
          }
        }

        function initParticles(){
          // Subtle weather-like particles (sparkle/dust)
          for(let i=0;i<18;i++){
            particles.push({
              x: Math.random() * width,
              y: Math.random() * height,
              vx: (Math.random() - 0.5) * 0.25,
              vy: (Math.random() - 0.5) * 0.25,
              r: Math.random() * 1.5 + 0.5,
              alpha: Math.random() * 0.4 + 0.1
            });
          }
        }

        function buildConnections(){
          connections.length = 0;
          // Connect nearby stars only, keep count low
          for(let i=0;i<stars.length && connections.length < MAX_CONNECTIONS;i++){
            let near = 0;
            for(let j=i+1;j<stars.length && near < 2;j++){
              const dx = stars[i].x - stars[j].x;
              const dy = stars[i].y - stars[j].y;
              const dist = Math.sqrt(dx*dx+dy*dy);
              if(dist < CONNECTION_DISTANCE){
                connections.push({a:stars[i], b:stars[j], alpha: 1 - dist/CONNECTION_DISTANCE});
                near++;
              }
            }
          }
        }

        let frame = 0;
        function draw(){
          ctx.clearRect(0,0,width,height);

          // Base deep-space fill
          ctx.fillStyle = '#0A0E1A';
          ctx.fillRect(0,0,width,height);

          // Subtle nebula gradient behind focal area
          const grad = ctx.createRadialGradient(width*0.5, height*0.28, 0, width*0.5, height*0.28, width*0.8);
          grad.addColorStop(0, 'rgba(74,158,255,0.08)');
          grad.addColorStop(0.4, 'rgba(30,58,95,0.04)');
          grad.addColorStop(1, 'rgba(10,14,26,0)');
          ctx.fillStyle = grad;
          ctx.fillRect(0,0,width,height);

          // Draw constellation lines
          ctx.lineWidth = 0.6;
          for(const c of connections){
            ctx.beginPath();
            ctx.moveTo(c.a.x, c.a.y);
            ctx.lineTo(c.b.x, c.b.y);
            ctx.strokeStyle = 'rgba(138,150,173,' + (c.alpha * 0.35).toFixed(3) + ')';
            ctx.stroke();
          }

          // Draw stars
          frame++;
          for(const s of stars){
            const a = s.alpha + Math.sin(frame * s.twinkle + s.phase) * 0.15;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(232,236,245,' + Math.max(0.1, Math.min(1, a)).toFixed(3) + ')';
            ctx.fill();
          }

          // Draw particles
          for(const p of particles){
            p.x += p.vx;
            p.y += p.vy;
            if(p.x < 0) p.x = width;
            if(p.x > width) p.x = 0;
            if(p.y < 0) p.y = height;
            if(p.y > height) p.y = 0;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(212,175,55,' + p.alpha.toFixed(3) + ')';
            ctx.fill();
          }

          requestAnimationFrame(draw);
        }

        // Scattered user dots layer
        const dotsLayer = document.getElementById('user-dots-layer');
        const userTypes = [
          {level:'super', size:72, border:'#D4AF37', glow:'rgba(212,175,55,0.35)', label:'企业/超级用户'},
          {level:'pro', size:54, border:'#A8B4C4', glow:'rgba(74,158,255,0.25)', label:'Pro用户'},
          {level:'free', size:40, border:'transparent', glow:'rgba(255,255,255,0.15)', label:'免费用户'}
        ];
        const userConfigs = [
          {t:0.12, l:0.15, type:2}, {t:0.18, l:0.78, type:1},
          {t:0.35, l:0.10, type:0}, {t:0.32, l:0.88, type:1},
          {t:0.55, l:0.22, type:2}, {t:0.50, l:0.70, type:0},
          {t:0.68, l:0.12, type:1}, {t:0.72, l:0.82, type:2},
          {t:0.82, l:0.38, type:0}, {t:0.78, l:0.58, type:1},
          {t:0.45, l:0.45, type:2}, {t:0.62, l:0.50, type:0}
        ];
        function renderUserDots(){
          dotsLayer.innerHTML = '';
          userConfigs.forEach((u, idx) => {
            const cfg = userTypes[u.type];
            const btn = document.createElement('button');
            btn.className = 'pointer-events-auto absolute rounded-full focus:outline-none focus-visible:ring-2 focus-visible:ring-[var(--cognicard-ring)] transition-transform active:scale-95';
            btn.style.top = (u.t * 100) + '%';
            btn.style.left = (u.l * 100) + '%';
            btn.style.width = cfg.size + 'px';
            btn.style.height = cfg.size + 'px';
            btn.style.transform = 'translate(-50%, -50%)';
            btn.style.border = '2px solid ' + cfg.border;
            btn.style.boxShadow = '0 0 18px ' + cfg.glow + ', inset 0 0 10px rgba(255,255,255,0.05)';
            btn.style.background = 'radial-gradient(circle at 30% 30%, rgba(255,255,255,0.25), rgba(26,34,51,0.85))';
            btn.setAttribute('data-dom-id', 'goto-public-profile-' + (idx + 1));
            btn.setAttribute('aria-label', '访问' + cfg.label + '主页');
            // Inner icon
            btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="' + (cfg.size*0.45) + '" height="' + (cfg.size*0.45) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[var(--cognicard-foreground)] opacity-90 absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
            dotsLayer.appendChild(btn);
          });
        }

        // Drag / pinch / double-tap interactions for the canvas stage
        const stage = document.getElementById('star-map-stage');
        let panning = false, lastX = 0, lastY = 0, offsetX = 0, offsetY = 0, scale = 1;
        stage.addEventListener('pointerdown', e => {
          if(e.target.closest('button, a')) return;
          panning = true; lastX = e.clientX; lastY = e.clientY; stage.setPointerCapture(e.pointerId);
        });
        stage.addEventListener('pointermove', e => {
          if(!panning) return;
          const dx = e.clientX - lastX, dy = e.clientY - lastY;
          offsetX += dx; offsetY += dy; lastX = e.clientX; lastY = e.clientY;
          updateTransform();
        });
        stage.addEventListener('pointerup', e => { panning = false; });
        stage.addEventListener('pointercancel', e => { panning = false; });
        stage.addEventListener('wheel', e => {
          e.preventDefault();
          const delta = e.deltaY > 0 ? 0.92 : 1.08;
          scale = Math.max(0.6, Math.min(2.5, scale * delta));
          updateTransform();
        }, {passive:false});
        stage.addEventListener('dblclick', () => { offsetX = 0; offsetY = 0; scale = 1; updateTransform(); });
        function updateTransform(){
          const content = document.getElementById('self-focal');
          // Apply a subtle parallax transform to the whole stage content except the fixed canvas
          const transform = 'translate(' + offsetX + 'px,' + offsetY + 'px) scale(' + scale + ')';
          document.getElementById('user-dots-layer').style.transform = transform;
          content.style.transform = 'translate(-50%, -50%) ' + transform.replace('translate('+offsetX+'px,'+offsetY+'px)', 'translate(' + (offsetX) + 'px, ' + (offsetY) + 'px)');
        }

        // Initialize
        resize();
        initParticles();
        buildConnections();
        draw();
        renderUserDots();
        window.addEventListener('resize', () => { resize(); buildConnections(); renderUserDots(); });
      })();
    </script>
</body>
</html>
