<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导入素材</title>
    <style id="theme-vars">
/* CogniCard Design Tokens — 认知名片平台 */

:root {
  /* Font system */
  --cognicard-font-sans: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --cognicard-font-mono: "SF Mono", "JetBrains Mono", "Fira Code", monospace;

  /* Radius scale */
  --cognicard-radius-sm: 4px;
  --cognicard-radius-md: 8px;
  --cognicard-radius-lg: 12px;
  --cognicard-radius-full: 9999px;

  /* Light mode (day / star-map daytime) */
  --cognicard-background: #F6F7F9;
  --cognicard-foreground: #0A0E1A;
  --cognicard-card: #FFFFFF;
  --cognicard-card-foreground: #0A0E1A;
  --cognicard-popover: #FFFFFF;
  --cognicard-popover-foreground: #0A0E1A;
  --cognicard-primary: #1E3A5F;
  --cognicard-primary-foreground: #FFFFFF;
  --cognicard-muted: #E8EBF0;
  --cognicard-muted-foreground: #5A6578;
  --cognicard-border: #D8DCE5;
  --cognicard-input: #FFFFFF;
  --cognicard-ring: #4A9EFF;

  /* Brand tints */
  --cognicard-brand-50: #E8F4FF;
  --cognicard-brand-100: #C7E6FF;
  --cognicard-brand-200: #96D0FF;
  --cognicard-brand-300: #5AB8FF;
  --cognicard-brand-400: #4A9EFF;
  --cognicard-brand-500: #2B8AFC;
  --cognicard-brand-600: #1E6FD1;
  --cognicard-brand-700: #1E3A5F;

  /* Surface scale (dark mode overrides below) */
  --cognicard-surface-base: var(--cognicard-background);
  --cognicard-surface-elevated: var(--cognicard-card);
  --cognicard-surface-highlight: var(--cognicard-muted);

  /* Member / state accents */
  --cognicard-gold: #D4AF37;
  --cognicard-gold-light: #F3E5AB;
  --cognicard-silver: #A8B4C4;

  /* State colors (semantic only) */
  --cognicard-state-success: #22C55E;
  --cognicard-state-warning: #F59E0B;
  --cognicard-state-error: #EF4444;
  --cognicard-state-info: #3B82F6;

  /* Glow / shadow */
  --cognicard-glow-primary: 0 0 24px rgba(74, 158, 255, 0.35);
  --cognicard-glow-gold: 0 0 24px rgba(212, 175, 55, 0.35);
  --cognicard-shadow-sm: 0 1px 2px rgba(10, 14, 26, 0.05);
  --cognicard-shadow-md: 0 8px 24px -8px rgba(10, 14, 26, 0.18);
  --cognicard-shadow-lg: 0 24px 60px -20px rgba(10, 14, 26, 0.30);
}

.dark {
  /* Dark mode (night / tool dashboard / immersive) */
  --cognicard-background: #0A0E1A;
  --cognicard-foreground: #E8ECF5;
  --cognicard-card: #1A2233;
  --cognicard-card-foreground: #E8ECF5;
  --cognicard-popover: #1A2233;
  --cognicard-popover-foreground: #E8ECF5;
  --cognicard-primary: #4A9EFF;
  --cognicard-primary-foreground: #0A0E1A;
  --cognicard-muted: #232D42;
  --cognicard-muted-foreground: #8A96AD;
  --cognicard-border: #2A3A55;
  --cognicard-input: #1A2233;
  --cognicard-ring: #4A9EFF;

  --cognicard-surface-base: var(--cognicard-background);
  --cognicard-surface-elevated: var(--cognicard-card);
  --cognicard-surface-highlight: var(--cognicard-muted);

  --cognicard-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.20);
  --cognicard-shadow-md: 0 8px 24px -8px rgba(0, 0, 0, 0.40);
  --cognicard-shadow-lg: 0 24px 60px -20px rgba(0, 0, 0, 0.55);
}

/* Typography utilities */
.cognicard-display {
  font-family: var(--cognicard-font-sans);
  font-size: clamp(40px, 6vw, 88px);
  line-height: 1.02;
  font-weight: 600;
  letter-spacing: -0.03em;
}

.cognicard-h1 {
  font-family: var(--cognicard-font-sans);
  font-size: clamp(28px, 3.5vw, 48px);
  line-height: 1.1;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.cognicard-h2 {
  font-family: var(--cognicard-font-sans);
  font-size: clamp(22px, 2.4vw, 32px);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.015em;
}

.cognicard-h3 {
  font-family: var(--cognicard-font-sans);
  font-size: 20px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.cognicard-body {
  font-family: var(--cognicard-font-sans);
  font-size: 15px;
  line-height: 1.6;
  font-weight: 400;
}

.cognicard-body-lg {
  font-family: var(--cognicard-font-sans);
  font-size: 17px;
  line-height: 1.55;
  font-weight: 400;
}

.cognicard-caption {
  font-family: var(--cognicard-font-sans);
  font-size: 13px;
  line-height: 1.5;
  font-weight: 400;
}

.cognicard-mono {
  font-family: var(--cognicard-font-mono);
  font-size: 13px;
  line-height: 1.5;
  font-weight: 500;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {

    --color-popover-foreground: var(--cognicard-popover-foreground);
    --color-primary: var(--cognicard-primary);

    --color-muted: var(--cognicard-muted);
    --color-muted-foreground: var(--cognicard-muted-foreground);
    --color-border: var(--cognicard-border);
    --color-input: var(--cognicard-input);
    --color-ring: var(--cognicard-ring);

  @layer base {

    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }

<body class="min-h-screen font-sans antialiased">
    <div id="app-shell" class="min-h-full flex flex-col">
        <!-- Global fixed top header -->
        <header class="fixed top-0 left-0 right-0 z-50 h-16 border-b border-[var(--cognicard-border)] bg-[var(--cognicard-background)]/90 backdrop-blur">
            <div class="w-full max-w-7xl mx-auto px-6 h-full flex items-center justify-between">
                <a href="index.html" class="flex items-center gap-2 text-[var(--cognicard-foreground)] font-semibold">
                    <i data-lucide="sparkles" class="w-5 h-5 text-[var(--cognicard-primary)]"></i>
                    <span>CogniCard</span>
                </a>
                <nav class="hidden md:flex items-center gap-6">
                    <a href="index.html" class="flex items-center gap-2 text-sm font-medium text-[var(--cognicard-muted-foreground)] pt-5 pb-5 transition-colors hover:text-[var(--cognicard-foreground)]">
                        <i data-lucide="globe" class="w-4 h-4"></i>
                        <span>星图</span>
                    </a>
                    <a href="tool-dashboard.html" class="flex items-center gap-2 text-sm font-medium text-[var(--cognicard-muted-foreground)] pt-5 pb-5 transition-colors hover:text-[var(--cognicard-foreground)]">
                        <i data-lucide="briefcase" class="w-4 h-4"></i>
                        <span>工具台</span>
                    </a>
                    <a href="notifications.html" class="flex items-center gap-2 text-sm font-medium text-[var(--cognicard-muted-foreground)] pt-5 pb-5 transition-colors hover:text-[var(--cognicard-foreground)]">
                        <i data-lucide="bell" class="w-4 h-4"></i>
                        <span>消息</span>
                    </a>
                    <a href="settings.html" class="flex items-center gap-2 text-sm font-medium text-[var(--cognicard-muted-foreground)] pt-5 pb-5 transition-colors hover:text-[var(--cognicard-foreground)]">
                        <i data-lucide="user" class="w-4 h-4"></i>
                        <span>我的</span>
                    </a>
                </nav>
                <div class="flex items-center gap-3">
                    <button class="p-2 rounded-lg text-[var(--cognicard-muted-foreground)] hover:bg-[var(--cognicard-muted)]">
                        <i data-lucide="search" class="w-4 h-4"></i>
                    </button>
                    <button class="w-8 h-8 rounded-full bg-[var(--cognicard-muted)] overflow-hidden" data-dom-id="nav-avatar">
                        <img src="../assets/avatar-placeholder.svg" alt="avatar" class="w-full h-full object-cover"/>
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 pt-24 pb-12 px-6">
            <div class="w-full max-w-5xl mx-auto">
                <div class="mb-10">
                    <h1 class="cognicard-h1 text-foreground mb-2">导入素材</h1>
                    <p class="text-muted-foreground">选择来源、提取内容、确认标签，三步完成素材入库。</p>
                </div>

                <!-- Step indicator -->
                <div class="flex items-center justify-between mb-10" id="stepper">
                    <div class="step-item flex items-center gap-3" data-step="1">
                        <div class="step-circle w-10 h-10 rounded-full flex items-center justify-center border text-sm font-semibold transition">1</div>
                        <span class="step-label text-sm font-medium">选择类型</span>
                    </div>
                    <div class="flex-1 h-px bg-border mx-4"></div>
                    <div class="step-item flex items-center gap-3" data-step="2">
                        <div class="step-circle w-10 h-10 rounded-full flex items-center justify-center border text-sm font-semibold transition">2</div>
                        <span class="step-label text-sm font-medium">粘贴/上传</span>
                    </div>
                    <div class="flex-1 h-px bg-border mx-4"></div>
                    <div class="step-item flex items-center gap-3" data-step="3">
                        <div class="step-circle w-10 h-10 rounded-full flex items-center justify-center border text-sm font-semibold transition">3</div>
                        <span class="step-label text-sm font-medium">确认并打标签</span>
                    </div>
                </div>

                <!-- Wizard content card -->
                <section class="bg-card border border-border rounded-xl p-8 shadow-lg">
                    <!-- Step 1: choose source type -->
                    <div id="panel-1" class="space-y-6">
                        <div>
                            <h2 class="cognicard-h3 text-foreground mb-1">选择素材来源</h2>
                            <p class="text-muted-foreground text-sm">选择一种导入方式，后续步骤会根据类型自动适配。</p>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4" id="type-grid">
                            <button type="button" data-type="url" class="type-card group flex flex-col items-center gap-3 p-6 rounded-xl border border-border bg-background text-left transition hover:border-primary hover:bg-muted focus:outline-none focus:ring-2 focus:ring-primary/50">
                                <i data-lucide="link" class="w-8 h-8 text-primary transition group-hover:scale-110"></i>
                                <div class="text-center">
                                    <div class="font-medium text-foreground">URL 链接</div>
                                    <div class="text-xs text-muted-foreground mt-1">网页/文章</div>
                                </div>
                            </button>
                            <button type="button" data-type="text" class="type-card group flex flex-col items-center gap-3 p-6 rounded-xl border border-border bg-background text-left transition hover:border-primary hover:bg-muted focus:outline-none focus:ring-2 focus:ring-primary/50">
                                <i data-lucide="file-text" class="w-8 h-8 text-primary transition group-hover:scale-110"></i>
                                <div class="text-center">
                                    <div class="font-medium text-foreground">文本</div>
                                    <div class="text-xs text-muted-foreground mt-1">纯文本/笔记</div>
                                </div>
                            </button>
                            <button type="button" data-type="file" class="type-card group flex flex-col items-center gap-3 p-6 rounded-xl border border-border bg-background text-left transition hover:border-primary hover:bg-muted focus:outline-none focus:ring-2 focus:ring-primary/50">
                                <i data-lucide="upload" class="w-8 h-8 text-primary transition group-hover:scale-110"></i>
                                <div class="text-center">
                                    <div class="font-medium text-foreground">文件上传</div>
                                    <div class="text-xs text-muted-foreground mt-1">PDF/DOC 等</div>
                                </div>
                            </button>
                            <button type="button" data-type="ocr" class="type-card group flex flex-col items-center gap-3 p-6 rounded-xl border border-border bg-background text-left transition hover:border-primary hover:bg-muted focus:outline-none focus:ring-2 focus:ring-primary/50">
                                <i data-lucide="scan-line" class="w-8 h-8 text-primary transition group-hover:scale-110"></i>
                                <div class="text-center">
                                    <div class="font-medium text-foreground">图片 OCR</div>
                                    <div class="text-xs text-muted-foreground mt-1">识别图中文字</div>
                                </div>
                            </button>
                            <button type="button" data-type="media" class="type-card group flex flex-col items-center gap-3 p-6 rounded-xl border border-border bg-background text-left transition hover:border-primary hover:bg-muted focus:outline-none focus:ring-2 focus:ring-primary/50">
                                <i data-lucide="mic" class="w-8 h-8 text-primary transition group-hover:scale-110"></i>
                                <div class="text-center">
                                    <div class="font-medium text-foreground">语音/视频</div>
                                    <div class="text-xs text-muted-foreground mt-1">音视频转录</div>
                                </div>
                            </button>
                        </div>
                    </div>

                    <!-- Step 2: paste / upload -->
                    <div id="panel-2" class="hidden space-y-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <h2 class="cognicard-h3 text-foreground mb-1" id="step2-title">粘贴内容</h2>
                                <p class="text-muted-foreground text-sm" id="step2-desc">输入素材内容后点击 AI 提取。</p>
                            </div>
                            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-muted text-muted-foreground border border-border" id="selected-type-chip">
                                <i data-lucide="link" class="w-3.5 h-3.5"></i>
                                <span>URL 链接</span>
                            </span>
                        </div>

                        <div id="url-text-area" class="space-y-4">
                            <textarea id="content-input" rows="8" class="w-full bg-input border border-border rounded-xl p-4 text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary resize-none" placeholder="在此粘贴 URL 或文本内容..."></textarea>
                        </div>

                        <div id="file-drop-area" class="hidden space-y-4">
                            <label id="drop-zone" for="file-upload" class="flex flex-col items-center justify-center gap-3 w-full rounded-xl border-2 border-dashed border-border bg-background p-12 text-center transition hover:border-primary hover:bg-muted cursor-pointer">
                                <i data-lucide="upload-cloud" class="w-10 h-10 text-primary"></i>
                                <div>
                                    <div class="font-medium text-foreground">拖拽文件到此处，或点击上传</div>
                                    <div class="text-sm text-muted-foreground mt-1" id="file-hint">支持常见文档、图片、音视频格式</div>
                                </div>
                                <input id="file-upload" type="file" class="hidden" />
                            </label>
                            <div id="file-selected" class="hidden flex items-center gap-3 p-3 rounded-lg bg-muted border border-border">
                                <i data-lucide="file" class="w-5 h-5 text-primary"></i>
                                <span class="text-sm text-foreground flex-1 truncate" id="file-name"></span>
                                <button type="button" id="clear-file" class="p-1 rounded hover:bg-background text-muted-foreground">
                                    <i data-lucide="x" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>

                        <div class="flex justify-end">
                            <button type="button" id="ai-extract-btn" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg bg-primary text-primary-foreground font-medium text-sm shadow-md hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-primary/50 disabled:opacity-50 disabled:cursor-not-allowed">
                                <i data-lucide="wand-2" class="w-4 h-4"></i>
                                <span>AI 提取</span>
                            </button>
                        </div>
                    </div>

                    <!-- Step 3: confirm and tag -->
                    <div id="panel-3" class="hidden space-y-6">
                        <div>
                            <h2 class="cognicard-h3 text-foreground mb-1">确认并打标签</h2>
                            <p class="text-muted-foreground text-sm">核对 AI 提取结果，补充标签后保存。</p>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div class="space-y-4">
                                <div class="p-4 rounded-xl bg-background border border-border">
                                    <div class="text-xs text-muted-foreground mb-1">标题</div>
                                    <div class="font-medium text-foreground" id="preview-title">--</div>
                                </div>
                                <div class="p-4 rounded-xl bg-background border border-border">
                                    <div class="text-xs text-muted-foreground mb-1">摘要</div>
                                    <p class="text-sm text-foreground leading-relaxed" id="preview-summary">--</p>
                                </div>
                                <div id="preview-source-wrap" class="p-4 rounded-xl bg-background border border-border">
                                    <div class="text-xs text-muted-foreground mb-1">来源链接</div>
                                    <a href="#" id="preview-source" class="text-sm text-primary hover:underline break-all" target="_blank" rel="noopener noreferrer">--</a>
                                </div>
                            </div>

                            <div class="space-y-4">
                                <div class="p-4 rounded-xl bg-background border border-border">
                                    <label for="tag-input" class="block text-xs text-muted-foreground mb-2">标签</label>
                                    <div class="flex flex-wrap items-center gap-2 p-2 rounded-lg bg-input border border-border focus-within:ring-2 focus-within:ring-primary">
                                        <div id="tag-list" class="flex flex-wrap items-center gap-2"></div>
                                        <input id="tag-input" type="text" class="flex-1 min-w-[120px] bg-transparent outline-none text-sm text-foreground placeholder:text-muted-foreground" placeholder="输入后回车添加" />
                                    </div>
                                    <p class="text-xs text-muted-foreground mt-2">按 Enter 添加标签，点击标签上的 × 可移除。</p>
                                </div>

                                <div class="p-4 rounded-xl bg-muted/50 border border-border">
                                    <div class="flex items-center gap-2 text-sm text-muted-foreground">
                                        <i data-lucide="info" class="w-4 h-4"></i>
                                        <span>保存后素材将加入你的知识库并可用于卡片生成。</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Wizard navigation -->
                <div class="flex items-center justify-between mt-8 pt-6 border-t border-border">
                    <button type="button" id="back-btn" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg border border-border bg-card text-foreground text-sm font-medium hover:bg-muted disabled:opacity-40 disabled:cursor-not-allowed transition">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i>
                        <span>上一步</span>
                    </button>
                    <div class="flex items-center gap-3">
                        <button type="button" id="next-btn" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg bg-primary text-primary-foreground text-sm font-medium shadow-md hover:opacity-90 disabled:opacity-40 disabled:cursor-not-allowed transition">
                            <span>下一步</span>
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </button>
                        <button type="button" id="save-btn" class="hidden inline-flex items-center gap-2 px-5 py-2.5 rounded-lg bg-[var(--cognicard-gold)] text-[var(--cognicard-background)] text-sm font-medium shadow-md hover:opacity-90 transition">
                            <i data-lucide="save" class="w-4 h-4"></i>
                            <span>保存素材</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const types = {
            url: { label: 'URL 链接', icon: 'link', mode: 'text', placeholder: '在此粘贴文章或网页链接...' },
            text: { label: '文本', icon: 'file-text', mode: 'text', placeholder: '在此粘贴文本内容、笔记或摘录...' },
            file: { label: '文件上传', icon: 'upload', mode: 'file', hint: '支持 PDF、Word、Markdown 等文档' },
            ocr: { label: '图片 OCR', icon: 'scan-line', mode: 'file', hint: '支持 JPG、PNG、WebP 等图片' },
            media: { label: '语音/视频', icon: 'mic', mode: 'file', hint: '支持 MP3、MP4、MOV 等音视频' }
        };

        const state = {
            step: 1,
            type: null,
            input: '',
            fileName: '',
            extracted: { title: '', summary: '', sourceUrl: '', tags: [] }
        };

        const els = {
            stepper: document.getElementById('stepper'),
            panel1: document.getElementById('panel-1'),
            panel2: document.getElementById('panel-2'),
            panel3: document.getElementById('panel-3'),
            typeCards: document.querySelectorAll('.type-card'),
            step2Title: document.getElementById('step2-title'),
            step2Desc: document.getElementById('step2-desc'),
            selectedTypeChip: document.getElementById('selected-type-chip'),
            urlTextArea: document.getElementById('url-text-area'),
            fileDropArea: document.getElementById('file-drop-area'),
            contentInput: document.getElementById('content-input'),
            fileUpload: document.getElementById('file-upload'),
            dropZone: document.getElementById('drop-zone'),
            fileSelected: document.getElementById('file-selected'),
            fileName: document.getElementById('file-name'),
            clearFile: document.getElementById('clear-file'),
            fileHint: document.getElementById('file-hint'),
            aiExtractBtn: document.getElementById('ai-extract-btn'),
            backBtn: document.getElementById('back-btn'),
            nextBtn: document.getElementById('next-btn'),
            saveBtn: document.getElementById('save-btn'),
            previewTitle: document.getElementById('preview-title'),
            previewSummary: document.getElementById('preview-summary'),
            previewSource: document.getElementById('preview-source'),
            previewSourceWrap: document.getElementById('preview-source-wrap'),
            tagInput: document.getElementById('tag-input'),
            tagList: document.getElementById('tag-list')
        };

        function render() {
            // Stepper
            document.querySelectorAll('.step-item').forEach(item => {
                const step = Number(item.dataset.step);
                const circle = item.querySelector('.step-circle');
                const label = item.querySelector('.step-label');
                circle.className = 'step-circle w-10 h-10 rounded-full flex items-center justify-center border text-sm font-semibold transition';
                label.className = 'step-label text-sm font-medium transition';
                if (step === state.step) {
                    circle.classList.add('bg-primary', 'text-primary-foreground', 'border-primary');
                    circle.style.boxShadow = '0 0 24px rgba(74, 158, 255, 0.35)';
                    label.classList.add('text-primary');
                } else if (step < state.step) {
                    circle.classList.add('bg-muted', 'text-primary', 'border-primary');
                    circle.style.boxShadow = 'none';
                    label.classList.add('text-foreground');
                } else {
                    circle.classList.add('bg-muted', 'text-muted-foreground', 'border-border');
                    circle.style.boxShadow = 'none';
                    label.classList.add('text-muted-foreground');
                }
            });

            // Panels
            [els.panel1, els.panel2, els.panel3].forEach((p, idx) => {
                p.classList.toggle('hidden', idx + 1 !== state.step);
            });

            // Type selection active state
            els.typeCards.forEach(card => {
                const active = card.dataset.type === state.type;
                card.classList.toggle('border-primary', active);
                card.classList.toggle('ring-2', active);
                card.classList.toggle('ring-primary/50', active);
                card.classList.toggle('shadow-[0_0_24px_rgba(74,158,255,0.25)]', active);
                card.classList.toggle('bg-muted', active);
            });

            // Navigation buttons
            els.backBtn.disabled = state.step === 1;
            const canGoNext = (state.step === 1 && state.type) || (state.step === 2 && state.extracted.title);
            els.nextBtn.disabled = !canGoNext;
            els.nextBtn.classList.toggle('hidden', state.step === 3);
            els.saveBtn.classList.toggle('hidden', state.step !== 3);

            if (state.step === 3) renderPreview();

            if (window.lucide) lucide.createIcons();
        }

        function selectType(type) {
            state.type = type;
            const t = types[type];
            if (t.mode === 'text') {
                els.contentInput.placeholder = t.placeholder;
                els.urlTextArea.classList.remove('hidden');
                els.fileDropArea.classList.add('hidden');
            } else {
                els.fileHint.textContent = t.hint;
                els.urlTextArea.classList.add('hidden');
                els.fileDropArea.classList.remove('hidden');
            }
            els.step2Title.textContent = t.mode === 'text' ? '粘贴内容' : '上传文件';
            els.step2Desc.textContent = t.mode === 'text' ? '输入素材内容后点击 AI 提取。' : '上传文件后点击 AI 提取。';
            els.selectedTypeChip.innerHTML = `<i data-lucide="${t.icon}" class="w-3.5 h-3.5"></i><span>${t.label}</span>`;
            render();
        }

        function aiExtract() {
            if (!state.type) return;
            if (types[state.type].mode === 'text') {
                const val = els.contentInput.value.trim();
                if (!val) return alert('请先输入内容');
                state.input = val;
                const isUrl = state.type === 'url' && /^https?:\/\//i.test(val);
                state.extracted = {
                    title: isUrl ? val.split('/').pop().slice(0, 40) || '网页素材' : val.slice(0, 40) || '文本素材',
                    summary: isUrl ? '已解析网页内容，提取关键段落与主题。' : val.slice(0, 160) + (val.length > 160 ? '...' : ''),
                    sourceUrl: isUrl ? val : '',
                    tags: ['AI提取', state.type === 'url' ? '网页' : '笔记']
                };
            } else {
                if (!state.fileName) return alert('请先上传文件');
                state.extracted = {
                    title: state.fileName.replace(/\.[^.]+$/, '').slice(0, 40) || '文件素材',
                    summary: `已识别文件 ${state.fileName}，完成内容提取与结构化摘要。`,
                    sourceUrl: '',
                    tags: ['AI提取', types[state.type].label]
                };
            }
            state.step = 3;
            render();
        }

        function renderPreview() {
            const { title, summary, sourceUrl, tags } = state.extracted;
            els.previewTitle.textContent = title || '--';
            els.previewSummary.textContent = summary || '--';
            if (sourceUrl) {
                els.previewSourceWrap.classList.remove('hidden');
                els.previewSource.href = sourceUrl;
                els.previewSource.textContent = sourceUrl;
            } else {
                els.previewSourceWrap.classList.add('hidden');
            }
            renderTags();
        }

        function renderTags() {
            els.tagList.innerHTML = state.extracted.tags.map((tag, idx) => `
                <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-primary/10 text-primary border border-primary/20">
                    ${tag}
                    <button type="button" data-idx="${idx}" class="tag-remove p-0.5 rounded hover:bg-primary/20">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </span>
            `).join('');
            els.tagList.querySelectorAll('.tag-remove').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.extracted.tags.splice(Number(btn.dataset.idx), 1);
                    renderTags();
                    if (window.lucide) lucide.createIcons();
                });
            });
        }

        function addTag(text) {
            const t = text.trim();
            if (!t) return;
            if (state.extracted.tags.includes(t)) return;
            state.extracted.tags.push(t);
            renderTags();
            if (window.lucide) lucide.createIcons();
        }

        // Event listeners
        els.typeCards.forEach(card => {
            card.addEventListener('click', () => selectType(card.dataset.type));
        });

        els.contentInput.addEventListener('input', (e) => { state.input = e.target.value; });

        els.fileUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                state.fileName = file.name;
                els.fileName.textContent = file.name;
                els.fileSelected.classList.remove('hidden');
                els.dropZone.classList.add('hidden');
            }
        });

        els.clearFile.addEventListener('click', () => {
            state.fileName = '';
            els.fileUpload.value = '';
            els.fileSelected.classList.add('hidden');
            els.dropZone.classList.remove('hidden');
        });

        // Drag and drop visual feedback
        els.dropZone.addEventListener('dragover', (e) => { e.preventDefault(); els.dropZone.classList.add('border-primary', 'bg-muted'); });
        els.dropZone.addEventListener('dragleave', () => { els.dropZone.classList.remove('border-primary', 'bg-muted'); });
        els.dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            els.dropZone.classList.remove('border-primary', 'bg-muted');
            const file = e.dataTransfer.files[0];
            if (file) {
                state.fileName = file.name;
                els.fileName.textContent = file.name;
                els.fileSelected.classList.remove('hidden');
                els.dropZone.classList.add('hidden');
            }
        });

        els.aiExtractBtn.addEventListener('click', aiExtract);

        els.backBtn.addEventListener('click', () => {
            if (state.step > 1) { state.step--; render(); }
        });

        els.nextBtn.addEventListener('click', () => {
            if (state.step === 1 && state.type) { state.step = 2; }
            else if (state.step === 2 && state.extracted.title) { state.step = 3; }
            render();
        });

        els.saveBtn.addEventListener('click', () => {
            alert('素材已保存到知识库');
            state.step = 1;
            state.type = null;
            state.input = '';
            state.fileName = '';
            state.extracted = { title: '', summary: '', sourceUrl: '', tags: [] };
            els.contentInput.value = '';
            els.fileUpload.value = '';
            els.fileSelected.classList.add('hidden');
            els.dropZone.classList.remove('hidden');
            render();
        });

        els.tagInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addTag(els.tagInput.value);
                els.tagInput.value = '';
            }
        });

        // Drop zone click also triggers file input
        els.dropZone.addEventListener('click', (e) => {
            if (e.target !== els.fileUpload) els.fileUpload.click();
        });

        render();
    </script>
</body>
</html>
